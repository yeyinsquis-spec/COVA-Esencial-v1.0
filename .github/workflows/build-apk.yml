name: Compilar APK COVA v1.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest

      - name: Ejecutar revision estatica Lint
        run: gradle lintDebug

      - name: Compilar APK Debug instalable
        run: gradle assembleDebug

      - name: Verificar existencia de APK compilada
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: COVA-v1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
